name: Deploy to GitHub Pages

# Automatically build and publish the site to the `gh-pages` branch whenever
# code is pushed to `main` (or run manually from the Actions tab).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to push to the `gh-pages` branch using the built-in token.
permissions:
  contents: write

# Only one deploy at a time; never cancel an in-progress deploy mid-push.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (clean, from lockfile)
        run: npm ci

      - name: Check Supabase secrets are configured
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::error::Missing VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY repository secrets."
            echo "Add them under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi

      - name: Build production bundle
        run: npm run build
        env:
          # Vite inlines VITE_* vars at build time. Without these the shipped
          # bundle throws at startup (supabaseClient has no fallback), so the
          # workflow fails fast above instead of deploying a broken site.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Run tests
        run: npm test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy dist/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # Keep the deployed branch as a plain static site (skip Jekyll) so
          # Vite's underscore-prefixed asset folders are not stripped.
          enable_jekyll: false
          # Replace the branch content with exactly this dist/ (orphan commit):
          # Hashed Vite assets change names every build; replace the branch so
          # stale index-*.js assets do not accumulate.
          force_orphan: true
